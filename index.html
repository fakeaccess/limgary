<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/hero-avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gary Lim — Product Design Leader. Chaos to clarity." />
    <link rel="canonical" href="https://limgary.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gary Lim" />
    <meta property="og:url" content="https://limgary.com/" />
    <meta property="og:title" content="Gary Lim — Product Design Leader" />
    <meta property="og:description" content="Gary Lim — Product Design Leader. Chaos to clarity." />
    <meta property="og:image" content="https://limgary.com/images/hero-avatar.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gary Lim — Product Design Leader" />
    <meta name="twitter:description" content="Gary Lim — Product Design Leader. Chaos to clarity." />
    <meta name="twitter:image" content="https://limgary.com/images/hero-avatar.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-render-blocking: fetched at high priority (as="style") while
         the page keeps painting with the fallback font, then swapped in via
         onload. The <noscript> covers the (rare) no-JS case. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Gary Lim — Product Design Leader</title>

    <!-- Privacy-friendly analytics (Plausible) — cookieless, no personal data
         collected. Requires limgary.com to be added as a site at
         plausible.io before visits start showing up in a dashboard. -->
    <script defer data-domain="limgary.com" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
