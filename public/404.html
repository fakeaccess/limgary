<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gary Lim</title>
    <script>
      // GitHub Pages SPA fallback: redirect unknown paths to index.html with the
      // original path encoded, so client-side routing can pick it up.
      var path = location.pathname + location.search + location.hash;
      sessionStorage.setItem('spa-redirect', path);
      location.replace(location.origin + '/');
    </script>
  </head>
  <body></body>
</html>
